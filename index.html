<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Gallery -->
    <div class="gallery">
        <!-- Lion Image -->
        <div class="photo">
            <img src="https://plus.unsplash.com/premium_photo-1666672388644-2d99f3feb9f1?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Lion" class="gallery-image">
            <p class="image-text">Lion - The King of the Jungle</p>
        </div>

        <!-- Tiger Image -->
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1533450718592-29d45635f0a9?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Tiger" class="gallery-image">
            <p class="image-text">Tiger - Majestic and Powerful</p>
        </div>

        <!-- Cat Image -->
        <div class="photo">
            <img src="https://plus.unsplash.com/premium_photo-1673967770669-91b5c2f2d0ce?q=80&w=1930&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Cat" class="gallery-image">
            <p class="image-text">Cat - Playful and Curious</p>
        </div>
    </div>

    <!-- Modal for Enlarged Image -->
    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage">
        <p id="modalText" class="modal-text"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
